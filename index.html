<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Naija Life: City of Dreams</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #101c2b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 25px;
}

#loading h1 {
    color: #ffd447;
    font-size: 28px;
}

#loading p {
    max-width: 350px;
    line-height: 1.6;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    text-shadow: 1px 2px 3px black;
}

#topbar {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
}

.panel {
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 10px;
}

#gameTitle {
    font-weight: bold;
    color: #ffd447;
    font-size: 15px;
}

#location {
    margin-top: 5px;
    font-size: 12px;
}

#money {
    font-size: 17px;
    font-weight: bold;
    color: #7dff9a;
}

#stats {
    font-size: 11px;
    margin-top: 5px;
}

#topButtons {
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: bold;
    font-size: 12px;
    color: white;
    background: #263b58;
    box-shadow: 0 3px 5px rgba(0,0,0,0.3);
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.95);
}

#message {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    border-radius: 10px;
    padding: 10px 15px;
    font-size: 13px;
    text-align: center;
    max-width: 85%;
    display: none;
}

#controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    height: 155px;
}

#joystickBase {
    position: absolute;
    left: 18px;
    bottom: 8px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.6);
    pointer-events: auto;
    touch-action: none;
}

#joystickBase::before {
    content: "▲";
    position: absolute;
    top: 7px;
    left: 52px;
    font-size: 12px;
    opacity: 0.8;
}

#joystickBase::after {
    content: "▼";
    position: absolute;
    bottom: 7px;
    left: 52px;
    font-size: 12px;
    opacity: 0.8;
}

#joystickKnob {
    position: absolute;
    width: 48px;
    height: 48px;
    left: 36px;
    top: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    border: 3px solid #263b58;
    box-shadow: 0 2px 6px black;
    pointer-events: none;
}

#actionButtons {
    position: absolute;
    right: 12px;
    bottom: 6px;
    display: grid;
    grid-template-columns: repeat(2, 72px);
    gap: 8px;
    pointer-events: auto;
}

.actionButton {
    height: 52px;
    border-radius: 50%;
    background: rgba(22, 42, 67, 0.9);
    border: 2px solid rgba(255,255,255,0.6);
    font-size: 11px;
}

#jumpButton {
    background: rgba(0, 119, 255, 0.9);
}

#runButton {
    background: rgba(0, 150, 70, 0.9);
}

#vehicleButton {
    background: rgba(180, 75, 0, 0.95);
}

#cameraButton {
    background: rgba(105, 40, 160, 0.95);
}

#help {
    position: absolute;
    bottom: 165px;
    left: 12px;
    background: rgba(0,0,0,0.55);
    padding: 7px 9px;
    border-radius: 8px;
    font-size: 10px;
    max-width: 190px;
}

#touchHint {
    position: absolute;
    bottom: 165px;
    right: 12px;
    font-size: 10px;
    background: rgba(0,0,0,0.55);
    padding: 7px;
    border-radius: 8px;
    max-width: 130px;
    text-align: center;
}

@media (min-width: 800px) {
    #joystickBase {
        width: 140px;
        height: 140px;
    }

    #joystickKnob {
        left: 42px;
        top: 42px;
    }

    #actionButtons {
        grid-template-columns: repeat(2, 85px);
    }

    .actionButton {
        height: 60px;
    }
}

@media (max-height: 420px) {
    #controls {
        bottom: 3px;
        height: 120px;
    }

    #joystickBase {
        width: 100px;
        height: 100px;
        left: 12px;
    }

    #joystickKnob {
        width: 40px;
        height: 40px;
        left: 28px;
        top: 28px;
    }

    #joystickBase::before {
        left: 42px;
    }

    #joystickBase::after {
        left: 42px;
    }

    #actionButtons {
        grid-template-columns: repeat(2, 65px);
        gap: 5px;
    }

    .actionButton {
        height: 43px;
    }

    #help, #touchHint {
        bottom: 125px;
    }
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>
</head>

<body>

<div id="loading">
    <h1>NAIJA LIFE</h1>
    <p>City of Dreams</p>
    <p id="loadingText">Building your city and loading your character...</p>
    <p>Please wait. Your game is starting.</p>
</div>

<div id="hud">

    <div id="topbar">
        <div class="panel">
            <div id="gameTitle">🇳🇬 NAIJA LIFE</div>
            <div id="location">City Centre</div>
        </div>

        <div class="panel">
            <div id="money">₦10,000</div>
            <div id="stats">On foot</div>
        </div>

        <div id="topButtons">
            <button id="saveButton">SAVE</button>
            <button id="loadButton">LOAD</button>
        </div>
    </div>

    <div id="message"></div>

    <div id="help">
        Use the joystick to move. Explore the city, find vehicles and enjoy your life in Naija!
    </div>

    <div id="touchHint">
        Turn your phone sideways for the best experience.
    </div>

    <div id="controls">
        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>

        <div id="actionButtons">
            <button class="actionButton" id="runButton">RUN</button>
            <button class="actionButton" id="jumpButton">JUMP</button>
            <button class="actionButton" id="vehicleButton">ENTER CAR</button>
            <button class="actionButton" id="cameraButton">CAMERA</button>
        </div>
    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';


/* =====================================================
   1. BASIC GAME SETTINGS
===================================================== */

const loadingScreen = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const messageBox = document.getElementById('message');
const locationText = document.getElementById('location');
const moneyText = document.getElementById('money');
const statsText = document.getElementById('stats');

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 320);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =====================================================
   2. LIGHTING
===================================================== */

const skyLight = new THREE.HemisphereLight(
    0xffffff,
    0x78845b,
    2.0
);

scene.add(skyLight);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);

sun.position.set(-60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

scene.add(sun);


/* =====================================================
   3. MATERIALS AND OBJECT CREATION
===================================================== */

function material(color, roughness = 0.9) {
    return new THREE.MeshStandardMaterial({
        color: color,
        roughness: roughness
    });
}

const grassMaterial = material(0x5b9c4b);
const roadMaterial = material(0x35383c);
const pavementMaterial = material(0xbab7ad);
const whiteMaterial = material(0xffffff);
const darkMaterial = material(0x252a30);
const windowMaterial = new THREE.MeshStandardMaterial({
    color: 0x8ac9df,
    roughness: 0.3,
    metalness: 0.1
});

function box(
    width,
    height,
    depth,
    color,
    x,
    y,
    z,
    parent = scene
) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material(color)
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function cylinder(
    radiusTop,
    radiusBottom,
    height,
    color,
    x,
    y,
    z,
    parent = scene
) {
    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
            radiusTop,
            radiusBottom,
            height,
            12
        ),
        material(color)
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;

    parent.add(mesh);

    return mesh;
}


/* =====================================================
   4. GROUND AND CITY ROADS
===================================================== */

box(600, 1, 600, 0x5b9c4b, 0, -0.6, 0);

const roads = [];

function createRoad(x, z, width, depth) {
    box(
        width,
        0.12,
        depth,
        0x35383c,
        x,
        -0.02,
        z
    );

    roads.push({
        x,
        z,
        width,
        depth
    });
}

createRoad(0, 0, 600, 18);
createRoad(0, 0, 18, 600);
createRoad(0, 70, 600, 16);
createRoad(0, -70, 600, 16);
createRoad(70, 0, 16, 600);
createRoad(-70, 0, 16, 600);

function createRoadMarkings() {
    for (let x = -285; x <= 285; x += 14) {
        box(6, 0.03, 0.25, 0xf5f0cf, x, 0.06, 0);
        box(6, 0.03, 0.25, 0xf5f0cf, x, 0.06, 70);
        box(6, 0.03, 0.25, 0xf5f0cf, x, 0.06, -70);
    }

    for (let z = -285; z <= 285; z += 14) {
        box(0.25, 0.03, 6, 0xf5f0cf, 0, 0.06, z);
        box(0.25, 0.03, 6, 0xf5f0cf, 70, 0.06, z);
        box(0.25, 0.03, 6, 0xf5f0cf, -70, 0.06, z);
    }
}

createRoadMarkings();


/* =====================================================
   5. BUILDINGS
===================================================== */

function createBuilding(x, z, width, depth, height, color) {
    const building = new THREE.Group();

    building.position.set(x, 0, z);
    scene.add(building);

    box(
        width,
        height,
        depth,
        color,
        0,
        height / 2,
        0,
        building
    );

    const floors = Math.max(1, Math.floor(height / 4));

    for (let floor = 0; floor < floors; floor++) {
        const y = 2 + floor * 4;

        for (
            let windowX = -width / 2 + 2;
            windowX < width / 2 - 1;
            windowX += 4
        ) {
            box(
                1.4,
                1.8,
                0.12,
                0x83cde5,
                windowX,
                y,
                depth / 2 + 0.07,
                building
            );

            box(
                1.4,
                1.8,
                0.12,
                0x83cde5,
                windowX,
                y,
                -depth / 2 - 0.07,
                building
            );
        }

        for (
            let windowZ = -depth / 2 + 2;
            windowZ < depth / 2 - 1;
            windowZ += 4
        ) {
            box(
                0.12,
                1.8,
                1.4,
                0x83cde5,
                width / 2 + 0.07,
                y,
                windowZ,
                building
            );

            box(
                0.12,
                1.8,
                1.4,
                0x83cde5,
                -width / 2 - 0.07,
                y,
                windowZ,
                building
            );
        }
    }

    return building;
}


/* Large buildings */

createBuilding(-28, -28, 18, 18, 35, 0xe2c5a4);
createBuilding(30, -30, 20, 18, 48, 0xc9d5e0);
createBuilding(-30, 30, 20, 18, 26, 0xf0d3a3);
createBuilding(30, 30, 20, 18, 38, 0xe8e8e8);

createBuilding(-105, -25, 25, 22, 32, 0xd9c0a1);
createBuilding(-140, -30, 25, 22, 42, 0xd1dce6);
createBuilding(-105, 30, 25, 22, 25, 0xf1d3a2);
createBuilding(-140, 30, 25, 22, 36, 0xd3d6d8);

createBuilding(105, -25, 25, 22, 40, 0xd9c0a1);
createBuilding(140, -30, 25, 22, 29, 0xd1dce6);
createBuilding(105, 30, 25, 22, 34, 0xf1d3a2);
createBuilding(140, 30, 25, 22, 45, 0xd3d6d8);

createBuilding(-30, -105, 22, 22, 28, 0xf0d3a3);
createBuilding(30, -105, 22, 22, 38, 0xe0dce8);
createBuilding(-30, 105, 22, 22, 35, 0xe3c5b2);
createBuilding(30, 105, 22, 22, 26, 0xd3e3d9);


/* Smaller neighbourhood buildings */

for (let x = -220; x <= 220; x += 30) {
    for (let z = -220; z <= 220; z += 30) {
        const nearRoad =
            Math.abs(z) < 18 ||
            Math.abs(z - 70) < 17 ||
            Math.abs(z + 70) < 17 ||
            Math.abs(x) < 18 ||
            Math.abs(x - 70) < 17 ||
            Math.abs(x + 70) < 17;

        if (nearRoad) continue;

        const distance = Math.sqrt(x * x + z * z);

        if (distance < 55) continue;

        const height = 8 + Math.random() * 12;
        const colors = [
            0xd8c3a5,
            0xe0d6c8,
            0xc8d5dd,
            0xd9b9a7,
            0xe6dfc9,
            0xbfcbb7
        ];

        createBuilding(
            x,
            z,
            12 + Math.random() * 5,
            12 + Math.random() * 5,
            height,
            colors[Math.floor(Math.random() * colors.length)]
        );
    }
}


/* =====================================================
   6. TREES
===================================================== */

function createTree(x, z) {
    const tree = new THREE.Group();

    tree.position.set(x, 0, z);
    scene.add(tree);

    cylinder(0.3, 0.45, 4, 0x765033, 0, 2, 0, tree);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 10, 8),
        material(0x23803b)
    );

    leaves.position.set(0, 5, 0);
    leaves.castShadow = true;

    tree.add(leaves);
}

for (let x = -250; x <= 250; x += 20) {
    createTree(x, 15);
    createTree(x, -15);
    createTree(x, 85);
    createTree(x, -85);
}

for (let z = -250; z <= 250; z += 20) {
    createTree(15, z);
    createTree(-15, z);
    createTree(85, z);
    createTree(-85, z);
}


/* =====================================================
   7. PLAYER
===================================================== */

const player = new THREE.Group();

player.position.set(0, 0, 5);

scene.add(player);

let characterModel = null;
let characterMixer = null;
let walkAction = null;

let characterLoaded = false;
let usingFallbackCharacter = false;


/* A simple character is used if the GLB cannot load. */

function createFallbackCharacter() {
    const fallback = new THREE.Group();

    const skin = material(0x9a6546);
    const shirt = material(0x2369c7);
    const trousers = material(0x222c40);
    const shoes = material(0x171717);

    const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.42, 0.75, 4, 8),
        shirt
    );

    body.position.y = 1.3;
    fallback.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 12, 12),
        skin
    );

    head.position.y = 2.15;
    fallback.add(head);

    const hair = new THREE.Mesh(
        new THREE.SphereGeometry(
            0.33,
            12,
            8,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        ),
        material(0x17110e)
    );

    hair.position.y = 2.25;
    fallback.add(hair);

    const leftArm = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.13, 0.55, 3, 6),
        skin
    );

    leftArm.position.set(-0.53, 1.3, 0);
    leftArm.rotation.z = 0.12;
    fallback.add(leftArm);

    const rightArm = leftArm.clone();

    rightArm.position.x = 0.53;
    rightArm.rotation.z = -0.12;

    fallback.add(rightArm);

    const leftLeg = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.16, 0.65, 3, 6),
        trousers
    );

    leftLeg.position.set(-0.2, 0.48, 0);
    fallback.add(leftLeg);

    const rightLeg = leftLeg.clone();

    rightLeg.position.x = 0.2;
    fallback.add(rightLeg);

    const leftShoe = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.16, 0.48),
        shoes
    );

    leftShoe.position.set(-0.2, 0.1, 0.1);
    fallback.add(leftShoe);

    const rightShoe = leftShoe.clone();

    rightShoe.position.x = 0.2;
    fallback.add(rightShoe);

    player.add(fallback);

    characterModel = fallback;
    usingFallbackCharacter = true;
    characterLoaded = true;
}


/* Load your downloaded character. */

const loader = new GLTFLoader();

loader.load(
    './grab3d-cozy-character.glb',

    function(gltf) {
        characterModel = gltf.scene;

        characterModel.traverse(function(object) {
            if (object.isMesh) {
                object.castShadow = true;
                object.receiveShadow = true;
            }
        });

        /* Fit the model to the game world. */

        const originalBox = new THREE.Box3().setFromObject(characterModel);
        const originalSize = originalBox.getSize(new THREE.Vector3());

        const largestDimension = Math.max(
            originalSize.x,
            originalSize.y,
            originalSize.z
        );

        if (largestDimension > 0) {
            characterModel.scale.setScalar(2.2 / largestDimension);
        }

        const scaledBox = new THREE.Box3().setFromObject(characterModel);

        characterModel.position.y -= scaledBox.min.y;

        player.add(characterModel);

        characterMixer = new THREE.AnimationMixer(characterModel);

        if (gltf.animations && gltf.animations.length > 0) {
            const walkClip =
                gltf.animations.find(function(clip) {
                    return /walk|walking|run|locomotion/i.test(clip.name);
                }) || gltf.animations[0];

            walkAction = characterMixer.clipAction(walkClip);
            walkAction.play();
            walkAction.paused = true;

            loadingText.textContent =
                'Character loaded! Starting your city...';
        } else {
            loadingText.textContent =
                'Character loaded! No walking animation was found, but movement is ready.';
        }

        characterLoaded = true;

        setTimeout(function() {
            loadingScreen.style.display = 'none';
            showMessage('Welcome to Naija Life: City of Dreams!');
        }, 700);
    },

    undefined,

    function(error) {
        console.error('Character loading error:', error);

        loadingText.textContent =
            'The downloaded character could not load. Starting with the built-in character...';

        createFallbackCharacter();

        setTimeout(function() {
            loadingScreen.style.display = 'none';

            showMessage(
                'The downloaded model did not load. You can still play with the built-in character.'
            );
        }, 1200);
    }
);


/* =====================================================
   8. VEHICLES
===================================================== */

const vehicles = [];

function createCar(x, z, color, name) {
    const car = new THREE.Group();

    car.position.set(x, 0, z);
    scene.add(car);

    box(
        2.2,
        0.7,
        4.2,
        color,
        0,
        0.8,
        0,
        car
    );

    box(1.65, 0.8, 2.1, 0xa9d4e7, 0, 1.45, -0.15, car);

    box(0.65, 0.15, 0.1, 0xffffcc, -0.65, 0.95, 2.12, car);
    box(0.65, 0.15, 0.1, 0xffffcc, 0.65, 0.95, 2.12, car);

    box(0.65, 0.18, 0.1, 0xff2424, -0.65, 0.9, -2.12, car);
    box(0.65, 0.18, 0.1, 0xff2424, 0.65, 0.9, -2.12, car);

    const wheels = [];

    for (const side of [-1, 1]) {
        for (const front of [-1, 1]) {
            const wheel = cylinder(
                0.42,
                0.42,
                0.25,
                0x171717,
                side * 1.05,
                0.45,
                front * 1.35,
                car
            );

            wheel.rotation.z = Math.PI / 2;
            wheels.push(wheel);
        }
    }

    vehicles.push({
        group: car,
        wheels: wheels,
        type: 'car',
        name: name,
        speed: 0,
        maxSpeed: 28,
        color: color
    });

    return car;
}

function createMotorcycle(x, z) {
    const bike = new THREE.Group();

    bike.position.set(x, 0, z);
    scene.add(bike);

    box(0.35, 0.55, 1.3, 0xd82020, 0, 0.9, 0, bike);

    box(0.7, 0.12, 0.35, 0x171717, 0, 1.25, -0.3, bike);

    const frontWheel = cylinder(
        0.38, 0.38, 0.16, 0x111111, 0, 0.38, 0.8, bike
    );

    frontWheel.rotation.z = Math.PI / 2;

    const rearWheel = cylinder(
        0.38, 0.38, 0.16, 0x111111, 0, 0.38, -0.7, bike
    );

    rearWheel.rotation.z = Math.PI / 2;

    vehicles.push({
        group: bike,
        wheels: [frontWheel, rearWheel],
        type: 'motorcycle',
        name: 'Motorcycle',
        speed: 0,
        maxSpeed: 20,
        color: 0xd82020
    });

    return bike;
}

createCar(0, -12, 0xd62727, 'Red Car');
createCar(12, 3, 0xeeeeee, 'White Car');
createCar(-12, 3, 0x174fbc, 'Blue Car');
createCar(85, 3, 0x171717, 'Black Car');

createMotorcycle(6, -7);


/* =====================================================
   9. GAME STATE
===================================================== */

const input = {
    x: 0,
    y: 0,
    running: false,
    jump: false,
    forward: false,
    backward: false,
    left: false,
    right: false
};

let money = 10000;
let playerHealth = 100;

let isDriving = false;
let currentVehicle = null;

let verticalVelocity = 0;
let isJumping = false;

let cameraMode = 0;

const clock = new THREE.Clock();

let walkTime = 0;


/* =====================================================
   10. MESSAGES
===================================================== */

let messageTimer = null;

function showMessage(text) {
    messageBox.textContent = text;
    messageBox.style.display = 'block';

    if (messageTimer) {
        clearTimeout(messageTimer);
    }

    messageTimer = setTimeout(function() {
        messageBox.style.display = 'none';
    }, 2600);
}


/* =====================================================
   11. JOYSTICK
===================================================== */

const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');

let joystickPointer = null;

function moveJoystick(event) {
    const rect = joystickBase.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = event.clientX - centerX;
    let dy = event.clientY - centerY;

    const maxDistance = rect.width * 0.31;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > maxDistance) {
        dx = dx / distance * maxDistance;
        dy = dy / distance * maxDistance;
    }

    input.x = dx / maxDistance;
    input.y = dy / maxDistance;

    joystickKnob.style.left =
        (rect.width / 2 + dx - joystickKnob.offsetWidth / 2) + 'px';

    joystickKnob.style.top =
        (rect.height / 2 + dy - joystickKnob.offsetHeight / 2) + 'px';
}

joystickBase.addEventListener('pointerdown', function(event) {
    joystickPointer = event.pointerId;

    joystickBase.setPointerCapture(event.pointerId);

    moveJoystick(event);
});

joystickBase.addEventListener('pointermove', function(event) {
    if (event.pointerId === joystickPointer) {
        moveJoystick(event);
    }
});

function resetJoystick() {
    joystickPointer = null;

    input.x = 0;
    input.y = 0;

    joystickKnob.style.left =
        (joystickBase.clientWidth / 2 - joystickKnob.offsetWidth / 2) + 'px';

    joystickKnob.style.top =
        (joystickBase.clientHeight / 2 - joystickKnob.offsetHeight / 2) + 'px';
}

joystickBase.addEventListener('pointerup', resetJoystick);
joystickBase.addEventListener('pointercancel', resetJoystick);
joystickBase.addEventListener('lostpointercapture', resetJoystick);


/* =====================================================
   12. BUTTONS
===================================================== */

const runButton = document.getElementById('runButton');
const jumpButton = document.getElementById('jumpButton');
const vehicleButton = document.getElementById('vehicleButton');
const cameraButton = document.getElementById('cameraButton');

runButton.addEventListener('pointerdown', function(event) {
    event.preventDefault();
    input.running = true;
});

function stopRunning() {
    input.running = false;
}

runButton.addEventListener('pointerup', stopRunning);
runButton.addEventListener('pointercancel', stopRunning);
runButton.addEventListener('lostpointercapture', stopRunning);

jumpButton.addEventListener('pointerdown', function(event) {
    event.preventDefault();

    if (!isDriving && !isJumping) {
        input.jump = true;
    }
});

vehicleButton.addEventListener('click', function() {
    if (isDriving) {
        exitVehicle();
    } else {
        enterNearestVehicle();
    }
});

cameraButton.addEventListener('click', function() {
    cameraMode = (cameraMode + 1) % 3;

    if (cameraMode === 0) {
        showMessage('Camera: Normal view');
    } else if (cameraMode === 1) {
        showMessage('Camera: Far view');
    } else {
        showMessage('Camera: Close view');
    }
});


/* =====================================================
   13. KEYBOARD CONTROLS
===================================================== */

window.addEventListener('keydown', function(event) {
    const key = event.key.toLowerCase();

    if (
        ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ']
        .includes(key)
    ) {
        event.preventDefault();
    }

    if (key === 'w' || key === 'arrowup') input.forward = true;
    if (key === 's' || key === 'arrowdown') input.backward = true;
    if (key === 'a' || key === 'arrowleft') input.left = true;
    if (key === 'd' || key === 'arrowright') input.right = true;

    if (key === 'shift') input.running = true;

    if (key === ' ' && !isJumping && !isDriving) {
        input.jump = true;
    }

    if (key === 'e') {
        if (isDriving) {
            exitVehicle();
        } else {
            enterNearestVehicle();
        }
    }

    if (key === 'c') {
        cameraMode = (cameraMode + 1) % 3;
    }
});

window.addEventListener('keyup', function(event) {
    const key = event.key.toLowerCase();

    if (key === 'w' || key === 'arrowup') input.forward = false;
    if (key === 's' || key === 'arrowdown') input.backward = false;
    if (key === 'a' || key === 'arrowleft') input.left = false;
    if (key === 'd' || key === 'arrowright') input.right = false;

    if (key === 'shift') input.running = false;
});


/* =====================================================
   14. ENTER AND EXIT VEHICLES
===================================================== */

function getNearestVehicle() {
    let nearest = null;
    let nearestDistance = Infinity;

    for (const vehicle of vehicles) {
        const distance = player.position.distanceTo(
            vehicle.group.position
        );

        if (distance < nearestDistance) {
            nearestDistance = distance;
            nearest = vehicle;
        }
    }

    if (nearest && nearestDistance < 8) {
        return nearest;
    }

    return null;
}

function enterNearestVehicle() {
    const nearest = getNearestVehicle();

    if (!nearest) {
        showMessage('Move closer to a car or motorcycle first.');
        return;
    }

    currentVehicle = nearest;
    isDriving = true;

    player.visible = false;

    vehicleButton.textContent = 'EXIT VEHICLE';

    showMessage('You entered the ' + nearest.name + '!');

    updateHUD();
}

function exitVehicle() {
    if (!currentVehicle) return;

    player.position.copy(currentVehicle.group.position);

    const behind = new THREE.Vector3(2, 0, 0);

    behind.applyAxisAngle(
        new THREE.Vector3(0, 1, 0),
        currentVehicle.group.rotation.y
    );

    player.position.add(behind);

    player.position.y = 0;
    player.rotation.y = currentVehicle.group.rotation.y;

    player.visible = true;

    isDriving = false;

    currentVehicle.speed = 0;
    currentVehicle = null;

    vehicleButton.textContent = 'ENTER CAR';

    showMessage('You left the vehicle.');

    updateHUD();
}


/* =====================================================
   15. PLAYER MOVEMENT
===================================================== */

function updatePlayer(delta) {
    if (isDriving) return;

    let moveX = input.x;
    let moveZ = input.y;

    if (input.forward) moveZ -= 1;
    if (input.backward) moveZ += 1;
    if (input.left) moveX -= 1;
    if (input.right) moveX += 1;

    const length = Math.sqrt(moveX * moveX + moveZ * moveZ);

    if (length > 1) {
        moveX /= length;
        moveZ /= length;
    }

    const moving = Math.abs(moveX) + Math.abs(moveZ) > 0.05;

    const speed = input.running ? 15 : 7;

    if (moving) {
        const direction = new THREE.Vector3(moveX, 0, moveZ);

        direction.applyAxisAngle(
            new THREE.Vector3(0, 1, 0),
            camera.rotation.y
        );

        player.position.x += direction.x * speed * delta;
        player.position.z += direction.z * speed * delta;

        player.rotation.y = Math.atan2(direction.x, direction.z);
    }

    player.position.x = THREE.MathUtils.clamp(
        player.position.x, -285, 285
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z, -285, 285
    );

    if (input.jump && !isJumping) {
        verticalVelocity = 8;
        isJumping = true;
    }

    input.jump = false;

    if (isJumping) {
        player.position.y += verticalVelocity * delta;

        verticalVelocity -= 20 * delta;

        if (player.position.y <= 0) {
            player.position.y = 0;
            verticalVelocity = 0;
            isJumping = false;
        }
    }

    if (characterMixer) {
        if (walkAction) {
            walkAction.paused = !moving || isJumping;
        }

        characterMixer.update(delta);
    }

    walkTime += delta * (input.running ? 15 : 9);
}


/* =====================================================
   16. VEHICLE MOVEMENT
===================================================== */

function updateVehicle(delta) {
    if (!isDriving || !currentVehicle) return;

    const vehicle = currentVehicle;

    let acceleration = 0;

    if (input.y < -0.15 || input.forward) {
        acceleration = 1;
    }

    if (input.y > 0.15 || input.backward) {
        acceleration = -1;
    }

    vehicle.speed += acceleration * 16 * delta;

    if (acceleration === 0) {
        vehicle.speed *= Math.pow(0.97, delta * 60);
    }

    vehicle.speed = THREE.MathUtils.clamp(
        vehicle.speed,
        -vehicle.maxSpeed * 0.45,
        vehicle.maxSpeed
    );

    let steering = input.x;

    if (input.left) steering -= 1;
    if (input.right) steering += 1;

    steering = THREE.MathUtils.clamp(steering, -1, 1);

    if (Math.abs(vehicle.speed) > 0.5) {
        vehicle.group.rotation.y +=
            steering * delta * 1.5 *
            Math.sign(vehicle.speed);
    }

    const forward = new THREE.Vector3(
        Math.sin(vehicle.group.rotation.y),
        0,
        Math.cos(vehicle.group.rotation.y)
    );

    vehicle.group.position.addScaledVector(
        forward,
        vehicle.speed * delta
    );

    vehicle.group.position.x = THREE.MathUtils.clamp(
        vehicle.group.position.x, -285, 285
    );

    vehicle.group.position.z = THREE.MathUtils.clamp(
        vehicle.group.position.z, -285, 285
    );

    for (const wheel of vehicle.wheels) {
        wheel.rotation.x += vehicle.speed * delta;
    }
}


/* =====================================================
   17. CAMERA
===================================================== */

const cameraTarget = new THREE.Vector3();

function updateCamera(delta) {
    const target = isDriving && currentVehicle
        ? currentVehicle.group
        : player;

    let distance = 8;
    let height = 4.2;

    if (cameraMode === 1) {
        distance = 14;
        height = 7;
    } else if (cameraMode === 2) {
        distance = 4.5;
        height = 2.6;
    }

    const rotation = target.rotation.y;

    const desiredPosition = new THREE.Vector3(
        target.position.x - Math.sin(rotation) * distance,
        target.position.y + height,
        target.position.z - Math.cos(rotation) * distance
    );

    camera.position.lerp(
        desiredPosition,
        1 - Math.pow(0.001, delta)
    );

    cameraTarget.set(
        target.position.x,
        target.position.y + 1.6,
        target.position.z
    );

    camera.lookAt(cameraTarget);
}


/* =====================================================
   18. LOCATION AND HUD
===================================================== */

function getLocationName() {
    const x = player.position.x;
    const z = player.position.z;

    if (Math.abs(x) < 45 && Math.abs(z) < 45) {
        return 'City Centre';
    }

    if (z < -75) return 'Northern District';
    if (z > 75) return 'Southern District';
    if (x < -75) return 'Western District';
    if (x > 75) return 'Eastern District';

    return 'City Streets';
}

function updateHUD() {
    moneyText.textContent = '₦' + money.toLocaleString();

    locationText.textContent = isDriving && currentVehicle
        ? 'Driving: ' + currentVehicle.name
        : getLocationName();

    if (isDriving && currentVehicle) {
        statsText.textContent =
            'Speed: ' + Math.round(Math.abs(currentVehicle.speed)) + ' km/h';
    } else {
        statsText.textContent = 'Health: ' + playerHealth + '% | On foot';
    }
}


/* =====================================================
   19. SAVE AND LOAD
===================================================== */

document.getElementById('saveButton').addEventListener('click', function() {
    const saveData = {
        x: player.position.x,
        y: player.position.y,
        z: player.position.z,
        rotation: player.rotation.y,
        money: money,
        health: playerHealth,
        cameraMode: cameraMode
    };

    try {
        localStorage.setItem(
            'naijaLifeSave',
            JSON.stringify(saveData)
        );

        showMessage('Game saved successfully!');
    } catch (error) {
        showMessage('Could not save on this browser.');
    }
});

document.getElementById('loadButton').addEventListener('click', function() {
    try {
        const saved = localStorage.getItem('naijaLifeSave');

        if (!saved) {
            showMessage('No saved game found yet.');
            return;
        }

        const data = JSON.parse(saved);

        player.position.set(data.x, data.y, data.z);
        player.rotation.y = data.rotation || 0;

        money = data.money ?? 10000;
        playerHealth = data.health ?? 100;
        cameraMode = data.cameraMode ?? 0;

        if (isDriving) {
            exitVehicle();
        }

        showMessage('Your saved game has been loaded!');

        updateHUD();
    } catch (error) {
        showMessage('Could not load your saved game.');
    }
});


/* =====================================================
   20. RESIZE SCREEN
===================================================== */

window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
});


/* =====================================================
   21. MAIN GAME LOOP
===================================================== */

let hudTimer = 0;

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    updatePlayer(delta);
    updateVehicle(delta);
    updateCamera(delta);

    hudTimer += delta;

    if (hudTimer > 0.25) {
        updateHUD();
        hudTimer = 0;
    }

    renderer.render(scene, camera);
}


/* =====================================================
   22. START THE GAME
===================================================== */

camera.position.set(0, 5, 15);
camera.lookAt(0, 1, 0);

resetJoystick();
updateHUD();

animate();

</script>
