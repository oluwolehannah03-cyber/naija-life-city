<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Naija Life: City of Dreams</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 5;
  color: white;
  background: rgba(0,0,0,0.65);
  padding: 10px 13px;
  border-radius: 12px;
  font-size: 13px;
}

#cameraButton {
  position: fixed;
  right: 12px;
  top: 12px;
  z-index: 5;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  background: #ffcf33;
  font-weight: bold;
}

#message {
  position: fixed;
  left: 50%;
  top: 75px;
  transform: translateX(-50%);
  z-index: 5;
  color: white;
  background: rgba(0,0,0,0.65);
  padding: 8px 12px;
  border-radius: 10px;
  text-align: center;
  font-size: 12px;
}

#joystick {
  position: fixed;
  bottom: 22px;
  left: 22px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 3px solid rgba(255,255,255,0.7);
  z-index: 10;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 48px;
  height: 48px;
  left: 35px;
  top: 35px;
  border-radius: 50%;
  background: #ffcf33;
  border: 3px solid white;
  box-shadow: 0 2px 8px #333;
}

#actions {
  position: fixed;
  bottom: 30px;
  right: 20px;
  z-index: 10;
  display: flex;
  gap: 12px;
  align-items: center;
}

.actionButton {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  border: 3px solid white;
  background: #e94b3c;
  color: white;
  font-weight: bold;
  font-size: 12px;
  touch-action: none;
}

#loading {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: #87ceeb;
  color: #222;
  z-index: 20;
  font-size: 18px;
}

@media (orientation: portrait) {
  #message::after {
    content: " Rotate your phone sideways for the best view!";
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <div>
    <h2>🇳🇬 Naija Life</h2>
    <p>Loading your city...</p>
    <small>Please keep your internet connection on.</small>
  </div>
</div>

<div id="hud">
  <strong>🇳🇬 NAIJA LIFE</strong><br>
  City of Dreams<br>
  Cash: ₦5,000<br>
  <span id="status">Exploring the city</span>
</div>

<div id="message">
  Explore your neighborhood!
</div>

<button id="cameraButton">📷 CHANGE VIEW</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="actions">
  <button class="actionButton" id="runButton">
    RUN
  </button>
  <button class="actionButton" id="jumpButton">
    JUMP
  </button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const container = document.getElementById('game');
const loading = document.getElementById('loading');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 130);

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'low-power'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff, 0x65734b, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(-20, 35, 15);
scene.add(sunlight);

// MATERIAL HELPER

function material(color) {
  return new THREE.MeshLambertMaterial({ color });
}

// BOX HELPER

function box(name, x, y, z, w, h, d, color) {
  const object = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material(color)
  );

  object.name = name;
  object.position.set(x, y, z);
  scene.add(object);
  return object;
}

// GROUND

box('Grass', 0, -0.4, 0, 110, 0.8, 110, 0x55a64e);

// ROADS

box('Main Road', 0, 0.02, 0, 12, 0.08, 100, 0x454545);
box('Cross Road', 0, 0.04, 0, 100, 0.08, 10, 0x454545);

// ROAD MARKINGS

for (let z = -45; z <= 45; z += 9) {
  box('Road Marking', 0, 0.09, z, 0.22, 0.03, 4, 0xffffff);
}

for (let x = -45; x <= 45; x += 9) {
  box('Road Marking', x, 0.10, 0, 4, 0.03, 0.22, 0xffffff);
}

// SIDEWALKS

box('Left Pavement', -8, 0.12, 0, 3, 0.25, 100, 0xbdbdbd);
box('Right Pavement', 8, 0.12, 0, 3, 0.25, 100, 0xbdbdbd);

// BUILDINGS

function building(x, z, color, label, width = 7, depth = 7) {
  const height = 4 + Math.random() * 3;

  box(label, x, height / 2, z, width, height, depth, color);

  // Roof
  box('Roof', x, height + 0.15, z,
      width + 0.4, 0.3, depth + 0.4, 0x51483e);

  // Door facing the road
  box('Door', x, 1.15, z + depth / 2 + 0.035,
      1.2, 2.2, 0.08, 0x65351d);

  // Front windows
  box('Window', x - 1.8, height * 0.65, z + depth / 2 + 0.05,
      1.2, 1, 0.08, 0x9ce8ff);

  box('Window', x + 1.8, height * 0.65, z + depth / 2 + 0.05,
      1.2, 1, 0.08, 0x9ce8ff);

  // Signboard
  const sign = box('Signboard', x, height + 0.65,
      z + depth / 2 + 0.1, width * 0.85, 0.65, 0.15, 0xffcf33);

  return sign;
}

building(-17, -18, 0xffa64d, 'Mama Titi Shop');
building(17, -18, 0xf4e3a1, 'City Apartments');
building(-19, 0, 0xe56b6f, 'Fresh Mart');
building(19, 0, 0x80c9a9, 'Dream House');
building(-18, 20, 0xa8a1ed, 'Fashion House');
building(18, 20, 0xffb4d1, 'City Hotel');
building(-30, -30, 0xe8d3a8, 'Family Home');
building(30, -30, 0x9ed4ef, 'Modern Home');
building(-30, 30, 0xf5a35c, 'Corner Shop');
building(30, 30, 0xc3e3a5, 'Green Apartments');

// TREES

function tree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.35, 2, 6),
    material(0x79502c)
  );

  trunk.position.set(x, 1, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 7, 6),
    material(0x238a45)
  );

  leaves.position.set(x, 2.8, z);
  scene.add(leaves);
}

for (let i = -40; i <= 40; i += 10) {
  tree(-11, i);
  tree(11, i);
}

// PLAYER

const player = new THREE.Group();
scene.add(player);

const skin = material(0x8d5524);
const shirt = material(0x1675d1);
const trousers = material(0x292c45);
const shoes = material(0x222222);

// Body
const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 1.1, 0.45),
  shirt
);
body.position.y = 1.65;
player.add(body);

// Head
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.36, 10, 8),
  skin
);
head.position.y = 2.45;
player.add(head);

// Hair
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.37, 10, 6),
  material(0x211711)
);
hair.position.y = 2.63;
hair.scale.y = 0.55;
player.add(hair);

// Arms
const arms = [];

for (const side of [-1, 1]) {
  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.24, 0.9, 0.28),
    skin
  );

  arm.position.set(side * 0.53, 1.68, 0);
  player.add(arm);
  arms.push(arm);
}

// Legs
const legs = [];

for (const side of [-1, 1]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.75, 0.35),
    trousers
  );

  leg.position.set(side * 0.22, 0.65, 0);
  player.add(leg);
  legs.push(leg);

  const shoe = new THREE.Mesh(
    new THREE.BoxGeometry(0.32, 0.18, 0.5),
    shoes
  );

  shoe.position.set(side * 0.22, 0.2, -0.07);
  player.add(shoe);
}

player.position.set(0, 0, 5);

// CONTROLS

const input = {
  x: 0,
  y: 0,
  running: false
};

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

let pointerId = null;

function moveStick(event) {
  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;

  const max = 37;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  stick.style.left = (35 + dx) + 'px';
  stick.style.top = (35 + dy) + 'px';

  input.x = dx / max;
  input.y = dy / max;
}

joystick.addEventListener('pointerdown', event => {
  pointerId = event.pointerId;
  joystick.setPointerCapture(pointerId);
  moveStick(event);
});

joystick.addEventListener('pointermove', event => {
  if (event.pointerId === pointerId) {
    moveStick(event);
  }
});

function releaseStick(event) {
  if (event.pointerId !== pointerId) return;

  pointerId = null;
  input.x = 0;
  input.y = 0;

  stick.style.left = '35px';
  stick.style.top = '35px';
}

joystick.addEventListener('pointerup', releaseStick);
joystick.addEventListener('pointercancel', releaseStick);

// RUN BUTTON

const runButton = document.getElementById('runButton');

runButton.addEventListener('pointerdown', () => {
  input.running = true;
});

function stopRunning() {
  input.running = false;
}

runButton.addEventListener('pointerup', stopRunning);
runButton.addEventListener('pointercancel', stopRunning);
runButton.addEventListener('pointerleave', stopRunning);

// JUMP

let jumpVelocity = 0;
let onGround = true;

document.getElementById('jumpButton').addEventListener('pointerdown', () => {
  if (onGround) {
    jumpVelocity = 6;
    onGround = false;
  }
});

// KEYBOARD SUPPORT

const keys = {};

window.addEventListener('keydown', event => {
  keys[event.key.toLowerCase()] = true;

  if (event.key.toLowerCase() === 'c') {
    toggleCamera();
  }
});

window.addEventListener('keyup', event => {
  keys[event.key.toLowerCase()] = false;
});

// CAMERA

let firstPerson = false;

function toggleCamera() {
  firstPerson = !firstPerson;

  document.getElementById('cameraButton').textContent =
    firstPerson ? '📷 THIRD PERSON' : '📷 FIRST PERSON';
}

document.getElementById('cameraButton').addEventListener('click', toggleCamera);

// GAME LOOP

const clock = new THREE.Clock();
let walkTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);

  let moveX = input.x;
  let moveZ = input.y;

  if (keys['a'] || keys['arrowleft']) moveX = -1;
  if (keys['d'] || keys['arrowright']) moveX = 1;
  if (keys['w'] || keys['arrowup']) moveZ = -1;
  if (keys['s'] || keys['arrowdown']) moveZ = 1;

  const moving = Math.abs(moveX) > 0.08 || Math.abs(moveZ) > 0.08;

  if (moving) {
    const speed = input.running ? 9 : 5;

    const directionLength = Math.hypot(moveX, moveZ) || 1;

    const dx = moveX / directionLength;
    const dz = moveZ / directionLength;

    player.position.x += dx * speed * delta;
    player.position.z += dz * speed * delta;

    player.rotation.y = Math.atan2(dx, dz);

    walkTime += delta * (input.running ? 15 : 9);

    legs[0].rotation.x = Math.sin(walkTime) * 0.55;
    legs[1].rotation.x = -Math.sin(walkTime) * 0.55;
    arms[0].rotation.x = -Math.sin(walkTime) * 0.35;
    arms[1].rotation.x = Math.sin(walkTime) * 0.35;
  } else {
    legs.forEach(leg => leg.rotation.x = 0);
    arms.forEach(arm => arm.rotation.x = 0);
  }

  // Keep player within the neighborhood
  player.position.x = THREE.MathUtils.clamp(player.position.x, -45, 45);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -45, 45);

  // Jump
  if (!onGround || jumpVelocity > 0) {
    player.position.y += jumpVelocity * delta;
    jumpVelocity -= 15 * delta;

    if (player.position.y <= 0) {
      player.position.y = 0;
      jumpVelocity = 0;
      onGround = true;
    }
  }

  // Camera follows player
  const target = new THREE.Vector3(
    player.position.x,
    player.position.y + 1.5,
    player.position.z
  );

  if (firstPerson) {
    camera.position.set(
      player.position.x,
      player.position.y + 2.35,
      player.position.z + 0.1
    );

    const forward = new THREE.Vector3(
      Math.sin(player.rotation.y),
      0,
      Math.cos(player.rotation.y)
    );

    camera.lookAt(
      camera.position.x + forward.x * 12,
      camera.position.y - 0.2,
      camera.position.z + forward.z * 12
    );
  } else {
    const cameraOffset = new THREE.Vector3(
      0,
      5,
      8
    );

    camera.position.copy(target).add(cameraOffset);
    camera.lookAt(target);
  }

  document.getElementById('status').textContent =
    moving ? (input.running ? 'Running around' : 'Walking around')
           : 'Exploring the city';

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

loading.style.display = 'none';

</script>
</body>
</html>
